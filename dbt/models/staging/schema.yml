version: 2

models:

  - name: stg_orders
    description: >
      Cleaned and typed orders. Adds delivery delay calculations, approval
      time, late-delivery flag, and truncated date columns for easy grouping.
      Null order_ids are filtered out.
    columns:
      - name: order_id
        description: Unique order identifier
        tests: [ not_null, unique ]
      - name: customer_id
        tests: [ not_null ]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved
      - name: purchased_at
        tests: [ not_null ]
      - name: delivery_delay_days
        description: Positive = delivered late; negative = delivered early; null if not yet delivered
      - name: is_late_delivery
        description: Boolean flag — true if actual delivery exceeded estimated delivery date

  - name: stg_customers
    description: >
      Cleaned customer records. City names are lower-cased and trimmed;
      state codes are upper-cased. Null customer_ids filtered out.
    columns:
      - name: customer_id
        tests: [ not_null, unique ]
      - name: customer_unique_id
        tests: [ not_null ]
      - name: state
        tests: [ not_null ]

  - name: stg_order_items
    description: >
      Order line items. price and freight_value are coalesced to 0 if null.
      total_item_value = price + freight_value.
    columns:
      - name: order_id
        tests: [ not_null ]
      - name: order_item_id
        tests: [ not_null ]
      - name: product_id
        tests: [ not_null ]
      - name: seller_id
        tests: [ not_null ]
      - name: price
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: freight_value
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: total_item_value
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: stg_products
    description: >
      Product catalogue with English category translation applied.
      NULL categories are labelled 'unknown'. Includes volumetric
      weight proxy (length × height × width in cm³).
    columns:
      - name: product_id
        tests: [ not_null, unique ]
      - name: category_name_english
        tests: [ not_null ]

  - name: stg_sellers
    description: >
      Seller registry. City names lower-cased; state codes upper-cased.
    columns:
      - name: seller_id
        tests: [ not_null, unique ]
      - name: state
        tests: [ not_null ]

  - name: stg_order_reviews
    description: >
      Customer satisfaction reviews. Adds sentiment bucket (positive /
      neutral / negative) and response_time_hours. Duplicate reviews per
      order are deduplicated by taking the latest review_creation_date.
    columns:
      - name: review_id
        tests: [ not_null ]
      - name: order_id
        tests: [ not_null ]
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [ 1, 2, 3, 4, 5 ]
      - name: sentiment
        tests:
          - not_null
          - accepted_values:
              values: [ positive, neutral, negative ]

  - name: stg_order_payments
    description: >
      Payment data aggregated to order level — one row per order.
      total_payment_value is the sum across all payment rows for the order.
    columns:
      - name: order_id
        tests: [ not_null, unique ]
      - name: total_payment_value
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: primary_payment_type
        tests:
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined
